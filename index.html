<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rozaidi Read & Co. | Civil & Corporate Lawyers Malaysia</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

/* =======================
   ROOT
======================= */

:root{
  --gold:#c9a227;
  --dark:#0b1220;
  --card:rgba(17,24,39,0.65);
  --text:#cbd5e1;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:var(--dark);
  color:white;
  overflow-x:hidden;
}

/* =======================
   CURSOR GLOW
======================= */

.cursor-glow{
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,
  rgba(201,162,39,0.18),
  transparent 60%);
  transform:translate(-50%,-50%);
  z-index:0;
  filter:blur(10px);
}

/* =======================
   NAVBAR GLASS
======================= */

header{
  position:fixed;
  top:0;
  width:100%;
  z-index:999;

  background:rgba(15,23,42,0.5);
  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,0.06);
}

.navbar{
  width:90%;
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
}

.logo{
  color:var(--gold);
  font-weight:800;
  font-size:22px;
}

/* =======================
   HERO
======================= */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:140px 20px;

  position:relative;
  background:
  linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
  url('images/hero.webp') center/cover no-repeat;
}

.hero-content{
  max-width:850px;
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:clamp(40px,6vw,70px);
  margin-bottom:20px;
}

.hero p{
  color:var(--text);
  font-size:18px;
}

/* glow orb */

.orb{
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle, rgba(201,162,39,0.25), transparent 70%);
  filter:blur(40px);
  top:-150px;
  right:-120px;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
  100%{transform:translateY(0)}
}

/* =======================
   BUTTONS
======================= */

.btn{
  padding:14px 26px;
  border-radius:10px;
  display:inline-block;
  margin-top:20px;
  font-weight:600;
  text-decoration:none;
}

.btn-primary{
  background:var(--gold);
  color:black;
  box-shadow:0 0 25px rgba(201,162,39,0.4);
}

.btn-primary:hover{
  transform:translateY(-3px);
}

/* =======================
   SECTIONS
======================= */

section{
  padding:100px 0;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

/* =======================
   GLASS CARDS
======================= */

.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:18px;
  padding:28px;
  backdrop-filter:blur(12px);
  transition:0.2s ease;
  transform-style:preserve-3d;
}

.card:hover{
  border-color:rgba(201,162,39,0.4);
}

/* grids */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* =======================
   TRUST BAR
======================= */

.trust{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:20px;
  text-align:center;
}

/* =======================
   REVEAL
======================= */

.reveal{
  opacity:0;
  transform:translateY(60px);
}

/* =======================
   FOOTER
======================= */

footer{
  text-align:center;
  padding:30px;
  border-top:1px solid rgba(255,255,255,0.08);
  color:#94a3b8;
}

</style>
</head>

<body>

<!-- CURSOR GLOW -->
<div class="cursor-glow"></div>

<header>
  <div class="navbar">
    <div class="logo">Rozaidi Read & Co.</div>
    <div>Services | Team | Contact</div>
  </div>
</header>

<section class="hero">

  <div class="orb"></div>

  <div class="hero-content">
    <h1>Legal Excellence. Delivered With Precision.</h1>
    <p>Corporate & Civil Legal Solutions in Malaysia</p>
    <a class="btn btn-primary">Get Consultation</a>
  </div>

</section>

<!-- TRUST -->
<section>
  <div class="container trust">
    <div class="card">500+ Cases</div>
    <div class="card">10+ Years Experience</div>
    <div class="card">Corporate Law</div>
    <div class="card">Fast Response</div>
  </div>
</section>

<!-- SERVICES -->
<section>
  <div class="container grid">

    <div class="card">Civil Litigation</div>
    <div class="card">Corporate Law</div>
    <div class="card">Contracts</div>
    <div class="card">Consultation</div>

  </div>
</section>

<footer>
  © 2026 Rozaidi Read & Co.
</footer>

<script>

/* =======================
   CURSOR FOLLOW
======================= */

const glow = document.querySelector(".cursor-glow");

document.addEventListener("mousemove",(e)=>{

  gsap.to(glow,{
    x:e.clientX,
    y:e.clientY,
    duration:0.4,
    ease:"power2.out"
  });

});

/* =======================
   GSAP HERO ANIMATION
======================= */

gsap.from(".hero h1",{
  y:80,
  opacity:0,
  duration:1.2,
  ease:"power3.out"
});

gsap.from(".hero p",{
  y:40,
  opacity:0,
  delay:0.3,
  duration:1
});

gsap.from(".btn",{
  scale:0.8,
  opacity:0,
  delay:0.5,
  duration:1
});

/* =======================
   SCROLL ANIMATION
======================= */

gsap.utils.toArray(".card").forEach(card=>{

  gsap.from(card,{
    scrollTrigger:{
      trigger:card,
      start:"top 85%"
    },
    y:60,
    opacity:0,
    duration:1,
    ease:"power3.out"
  });

});

/* =======================
   3D TILT (SMOOTH)
======================= */

document.querySelectorAll(".card").forEach(card=>{

  card.addEventListener("mousemove",(e)=>{

    const r = card.getBoundingClientRect();

    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;

    const rotateX = (y - 0.5) * -10;
    const rotateY = (x - 0.5) * 10;

    gsap.to(card,{
      rotateX,
      rotateY,
      scale:1.03,
      duration:0.4
    });

  });

  card.addEventListener("mouseleave",()=>{

    gsap.to(card,{
      rotateX:0,
      rotateY:0,
      scale:1,
      duration:0.6
    });

  });

});

</script>

</body>
</html>
